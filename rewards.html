<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Награды — Token Hub</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

  <div class="container header-inner">

    <a class="brand" href="index.html">
      Token Hub
    </a>

    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="wallet.html">Кошелёк</a>
      <a href="rewards.html" class="active">Награды</a>
      <a href="transactions.html">История</a>
    </nav>

  </div>

</header>

<main class="container legal-page">

  <span class="eyebrow">REWARDS</span>

  <h1>Получить THC</h1>

  <section class="legal-card">

    <h2>Приветственный бонус</h2>

    <p>
      Новый профиль получает 100 THC один раз.
    </p>

    <button id="welcomeButton" class="primary-button">
      Получить бонус
    </button>

  </section>

  <section class="legal-card">

    <h2>Ежедневная награда</h2>

    <p>
      Один раз в сутки можно получить 10 THC.
    </p>

    <button id="dailyButton" class="primary-button">
      Получить 10 THC
    </button>

  </section>

  <div id="message" class="muted"></div>

</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const message =
    document.getElementById("message");

  function notify(text) {
    message.textContent = text;
  }

  const profile =
    await TokenHubAPI.getProfile();

  if (!profile) {
    notify(
      "Сначала создай профиль на главной странице."
    );
  }

  document
    .getElementById("welcomeButton")
    .addEventListener("click", async () => {

      const current =
        await TokenHubAPI.getBalance();

      const transactions =
        await TokenHubAPI.getTransactions();

      const alreadyReceived =
        transactions.some(
          item =>
            item.reason ===
            "Приветственный бонус"
        );

      if (alreadyReceived) {
        notify("Приветственный бонус уже получен.");
        return;
      }

      if (!profile) {
        notify("Сначала создай профиль.");
        return;
      }

      await TokenHubAPI.addCoins(
        100,
        "Приветственный бонус"
      );

      notify("Получено 100 THC.");
    });

  document
    .getElementById("dailyButton")
    .addEventListener("click", async () => {

      const profile =
        await TokenHubAPI.getProfile();

      if (!profile) {
        notify("Сначала создай профиль.");
        return;
      }

      const transactions =
        await TokenHubAPI.getTransactions();

      const today =
        new Date().toISOString().slice(0,10);

      const already =
        transactions.some(item =>
          item.reason === "Ежедневная награда" &&
          item.date.slice(0,10) === today
        );

      if (already) {
        notify(
          "Сегодняшняя награда уже получена."
        );
        return;
      }

      await TokenHubAPI.addCoins(
        10,
        "Ежедневная награда"
      );

      notify("Получено 10 THC.");
    });

});
</script>

</body>
</html>
